name: Build Android (.apk)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Localiza NDK nativo do runner ou instala a versão 26
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Instalando NDK..."
            echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_DIR="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK configurado em: $NDK_DIR"

      - name: Instalar Toolchain Rust e Targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Inicializar Projeto Android (Tauri v2)
        run: npx tauri android init --ci --skip-targets-install
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Compilar APK Android
        run: npx tauri android build --apk --debug --ci
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Organizar APK para Distribuição
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/SisProva-Android.apk \;

      - name: Salvar Artefato (.apk) para Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SisProva-Android-APK
          path: dist-apk/*.apk
          if-no-files-found: warn

      - name: Anexar APK na Release do GitHub (quando acionado por Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
