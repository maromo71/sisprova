[package]
name = "avaliador-app"
version = "1.1.0"
description = "Sistema Desktop Offline para Criação de Avaliações e Banco de Questões"
authors = ["AvaliadorApp Team"]
edition = "2021"

[lib]
name = "avaliador_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.dev]
# Desativa compilação incremental no Windows para evitar conflito de lock com antivírus em dep-graph.bin
incremental = false
