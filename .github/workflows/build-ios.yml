name: Build iOS / iPhone (Xcode & .ipa)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Toolchain Rust e Targets iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Inicializar Projeto iOS (Tauri v2)
        run: npx tauri ios init --ci

      - name: Compilar Código e Dependências iOS (Tauri v2)
        run: npx tauri ios build --ci --no-bundle
        continue-on-error: true

      - name: Compactar Projeto Xcode para Abertura no Mac / TestFlight
        run: |
          cd src-tauri/gen/apple
          tar -czf ../../../SisProva-iOS-Xcode.tar.gz .

      - name: Salvar Artefatos iOS para Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SisProva-iOS-Package
          path: |
            SisProva-iOS-Xcode.tar.gz
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn

      - name: Anexar Artefatos iOS na Release do GitHub (quando acionado por Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SisProva-iOS-Xcode.tar.gz
            src-tauri/gen/apple/build/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
